    <rect x="968" y="716" width="60" height="84" fill="#1e6fff"/>
    <rect x="1048" y="736" width="60" height="64" fill="#22304a"/>
    <rect x="1128" y="708" width="60" height="92" fill="#1e6fff"/>
    <rect x="1208" y="728" width="60" height="72" fill="#22304a"/>
    <rect x="1288" y="700" width="60" height="100" fill="#1e6fff"/>
