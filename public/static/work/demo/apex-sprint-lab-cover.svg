<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Abstract product-interface study for the fictional Apex Sprint Lab training application. Demonstration artwork, not client work.">
  <!-- Original demonstration artwork for a fictional product. No animation. -->
  <rect width="1600" height="1000" fill="#0b1220"/>

  <!-- App shell -->
  <rect x="120" y="70" width="1360" height="810" fill="#101a2c" stroke="#22304a" stroke-width="2"/>

  <!-- Sidebar -->
  <rect x="120" y="70" width="280" height="810" fill="#0d1526" stroke="#22304a" stroke-width="2"/>
  <text x="160" y="150" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="4" fill="#ffffff">APEX</text>
  <text x="160" y="182" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#1e6fff">SPRINT LAB</text>
  <rect x="160" y="240" width="200" height="40" rx="6" fill="#1e6fff"/>
  <rect x="184" y="256" width="96" height="9" rx="4.5" fill="#ffffff"/>
  <rect x="184" y="322" width="120" height="9" rx="4.5" fill="#5d6b85"/>
  <rect x="184" y="368" width="100" height="9" rx="4.5" fill="#5d6b85"/>
  <rect x="184" y="414" width="140" height="9" rx="4.5" fill="#5d6b85"/>
  <rect x="184" y="460" width="90" height="9" rx="4.5" fill="#5d6b85"/>

  <!-- Session plan header -->
  <rect x="448" y="128" width="360" height="20" rx="10" fill="#ffffff"/>
  <rect x="448" y="168" width="220" height="10" rx="5" fill="#5d6b85"/>
  <rect x="1180" y="128" width="252" height="46" rx="23" fill="#1e6fff"/>
  <rect x="1244" y="147" width="124" height="9" rx="4.5" fill="#ffffff"/>

  <!-- Timing table: session reps -->
  <g>
    <line x1="448" y1="240" x2="1432" y2="240" stroke="#22304a" stroke-width="2"/>
    <text x="448" y="292" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3c4">01</text>
    <rect x="512" y="276" width="180" height="12" rx="6" fill="#dfe6f2"/>
    <rect x="900" y="276" width="220" height="12" rx="6" fill="#1e6fff"/>
    <rect x="1340" y="276" width="92" height="12" rx="6" fill="#8fa3c4"/>
  </g>
  <g>
    <line x1="448" y1="330" x2="1432" y2="330" stroke="#22304a" stroke-width="2"/>
    <text x="448" y="382" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3c4">02</text>
    <rect x="512" y="366" width="150" height="12" rx="6" fill="#dfe6f2"/>
    <rect x="900" y="366" width="300" height="12" rx="6" fill="#1e6fff"/>
    <rect x="1340" y="366" width="92" height="12" rx="6" fill="#8fa3c4"/>
  </g>
  <g>
    <line x1="448" y1="420" x2="1432" y2="420" stroke="#22304a" stroke-width="2"/>
    <text x="448" y="472" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3c4">03</text>
    <rect x="512" y="456" width="200" height="12" rx="6" fill="#dfe6f2"/>
    <rect x="900" y="456" width="260" height="12" rx="6" fill="#1e6fff"/>
    <rect x="1340" y="456" width="92" height="12" rx="6" fill="#8fa3c4"/>
  </g>
  <g>
    <line x1="448" y1="510" x2="1432" y2="510" stroke="#22304a" stroke-width="2"/>
    <text x="448" y="562" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3c4">04</text>
    <rect x="512" y="546" width="170" height="12" rx="6" fill="#dfe6f2"/>
    <rect x="900" y="546" width="340" height="12" rx="6" fill="#1e6fff"/>
    <rect x="1340" y="546" width="92" height="12" rx="6" fill="#8fa3c4"/>
  </g>
  <line x1="448" y1="600" x2="1432" y2="600" stroke="#22304a" stroke-width="2"/>

  <!-- Progress panel: static season bars -->
  <rect x="448" y="648" width="984" height="184" fill="#0d1526" stroke="#22304a" stroke-width="2"/>
  <rect x="488" y="688" width="180" height="12" rx="6" fill="#dfe6f2"/>
  <g>
    <rect x="488" y="744" width="60" height="56" fill="#22304a"/>
    <rect x="568" y="760" width="60" height="40" fill="#22304a"/>
    <rect x="648" y="732" width="60" height="68" fill="#1e6fff"/>
    <rect x="728" y="748" width="60" height="52" fill="#22304a"/>
    <rect x="808" y="724" width="60" height="76" fill="#1e6fff"/>
