  <!-- Demo label -->
  <text x="120" y="946" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#8fa3c4">DEMO — FICTIONAL PRODUCT · NOT CLIENT WORK</text>
</svg>
