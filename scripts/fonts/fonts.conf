<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Registers the bundled Instrument Serif / Instrument Sans files (OFL, see
     OFL.txt) with fontconfig so sharp's SVG rasteriser prints the site's real
     typefaces in the Open Graph covers. Used only by
     scripts/generate-static-assets.mjs. -->
<fontconfig>
  <dir prefix="default">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <cachedir prefix="default">cache</cachedir>
</fontconfig>
